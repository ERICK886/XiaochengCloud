name: xiaocheng_netdisk
description: 小程网盘 - 轻量化云存储工具
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  dio: ^5.4.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  go_router: ^13.0.0
  flutter_secure_storage: ^9.0.0
  file_picker: ^6.1.1
  open_filex: ^4.4.0
  path_provider: ^2.1.2
  permission_handler: ^11.2.0
  cached_network_image: ^3.3.1
  fluttertoast: ^8.2.2
  pull_to_refresh_flutter3: ^2.0.2
  image_picker: ^1.0.7
  photo_manager: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
