<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' http://localhost:*">
  <title>小程网盘</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background-color: #f5f5f5;
      color: #212121;
      height: 100vh;
      display: flex;
    }

    .sidebar {
      width: 200px;
      background-color: #ffffff;
      border-right: 1px solid #e0e0e0;
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #e0e0e0;
    }

    .sidebar-header .logo {
      width: 32px;
      height: 32px;
      background-color: #1E88E5;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
    }

    .sidebar-header h1 {
      font-size: 16px;
      font-weight: 600;
    }

    .sidebar-nav {
      flex: 1;
      padding: 10px 0;
    }

    .nav-item {
      display: flex;
      align-items: center;
      padding: 12px 20px;
      cursor: pointer;
      color: #757575;
      transition: all 0.2s;
    }

    .nav-item:hover {
      background-color: #f5f5f5;
      color: #212121;
    }

    .nav-item.active {
      background-color: #e3f2fd;
      color: #1E88E5;
    }

    .nav-item svg {
      width: 20px;
      height: 20px;
      margin-right: 12px;
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .toolbar {
      height: 56px;
      background-color: #ffffff;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 12px;
    }

    .toolbar-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background-color: #f5f5f5;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      color: #212121;
      transition: all 0.2s;
    }

    .toolbar-btn:hover {
      background-color: #e0e0e0;
    }

    .toolbar-btn.primary {
      background-color: #1E88E5;
      color: white;
    }

    .toolbar-btn.primary:hover {
      background-color: #1565C0;
    }

    .search-box {
      flex: 1;
      max-width: 400px;
      display: flex;
      align-items: center;
      background-color: #f5f5f5;
      border-radius: 4px;
      padding: 0 12px;
    }

    .search-box input {
      flex: 1;
      border: none;
      background: none;
      outline: none;
      padding: 8px;
      font-size: 14px;
    }

    .file-list {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .file-item {
      display: flex;
      align-items: center;
      padding: 12px;
      background-color: white;
      border-radius: 8px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .file-item:hover {
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .file-item.selected {
      background-color: #e3f2fd;
    }

    .file-icon {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 12px;
    }

    .file-icon.folder {
      color: #1E88E5;
    }

    .file-info {
      flex: 1;
    }

    .file-name {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .file-meta {
      font-size: 12px;
      color: #757575;
    }

    .file-actions {
      display: flex;
      gap: 8px;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .file-item:hover .file-actions {
      opacity: 1;
    }

    .action-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      color: #757575;
    }

    .action-btn:hover {
      background-color: #f5f5f5;
      color: #212121;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #757575;
    }

    .empty-state svg {
      width: 80px;
      height: 80px;
      margin-bottom: 16px;
    }

    .upload-progress {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 320px;
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      padding: 16px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .progress-bar {
      height: 4px;
      background-color: #e0e0e0;
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background-color: #1E88E5;
      transition: width 0.3s;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="logo">XC</div>
      <h1>小程网盘</h1>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 8l4-4h10l4 4M3 8v12a2 2 0 002 2h14a2 2 0 002-2V8M3 8h18"/>
        </svg>
        <span>文件列表</span>
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
        </svg>
        <span>收藏</span>
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 6h18M3 12h18M3 18h18"/>
        </svg>
        <span>回收站</span>
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
        <span>备份</span>
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
          <path d="M8.59 13.51l6.83 3.98M15.41 6.51l-6.82 3.98"/>
        </svg>
        <span>分享记录</span>
      </div>
    </nav>
  </div>

  <div class="main-content">
    <div class="toolbar">
      <button class="toolbar-btn primary" id="uploadBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
        </svg>
        上传
      </button>
      <button class="toolbar-btn" id="newFolderBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/>
          <line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/>
        </svg>
        新建文件夹
      </button>
      <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
        </svg>
        <input type="text" placeholder="搜索文件..." id="searchInput">
      </div>
    </div>

    <div class="file-list" id="fileList">
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
          <path d="M3 8l4-4h10l4 4M3 8v12a2 2 0 002 2h14a2 2 0 002-2V8M3 8h18"/>
        </svg>
        <p>暂无文件</p>
      </div>
    </div>
  </div>

  <script>
    const { electronAPI } = window;

    document.getElementById('uploadBtn').addEventListener('click', async () => {
      const filePaths = await electronAPI.selectFiles();
      if (filePaths.length > 0) {
        console.log('Selected files:', filePaths);
      }
    });

    document.getElementById('newFolderBtn').addEventListener('click', () => {
      console.log('Create new folder');
    });

    document.getElementById('searchInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        console.log('Search:', e.target.value);
      }
    });

    electronAPI.onFilesSelected((filePaths) => {
      console.log('Files selected from menu:', filePaths);
    });

    electronAPI.onCreateFolder(() => {
      console.log('Create folder from shortcut');
    });

    electronAPI.onFocusSearch(() => {
      document.getElementById('searchInput').focus();
    });
  </script>
</body>
</html>
