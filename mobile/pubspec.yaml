name: xiaocheng_netdisk
description: "小程网盘 - 轻量化云存储应用"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # State Management
  provider: ^6.1.2
  
  # Network
  dio: ^5.4.3+1
  
  # Local Storage
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3+1
  
  # File & Path
  path_provider: ^2.1.3
  file_picker: ^8.0.3
  
  # UI Components
  cached_network_image: ^3.3.1
  fluttertoast: ^8.2.4
  pull_to_refresh_flutter3: ^2.0.2
  
  # Utils
  intl: ^0.19.0
  uuid: ^4.4.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
